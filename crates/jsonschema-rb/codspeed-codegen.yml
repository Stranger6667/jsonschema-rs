benchmarks:
  - name: "ruby-codegen-valid-openapi"
    exec: ruby --disable-gems -Ilib bench/codspeed_bench.rb openapi codegen-valid 20
  - name: "ruby-codegen-valid-swagger"
    exec: ruby --disable-gems -Ilib bench/codspeed_bench.rb swagger codegen-valid 10
  - name: "ruby-codegen-valid-geojson"
    exec: ruby --disable-gems -Ilib bench/codspeed_bench.rb geojson codegen-valid 100
  - name: "ruby-codegen-valid-citm"
    exec: ruby --disable-gems -Ilib bench/codspeed_bench.rb citm codegen-valid 25
  - name: "ruby-codegen-valid-fhir"
    exec: ruby --disable-gems -Ilib bench/codspeed_bench.rb fhir codegen-valid 25000
  - name: "ruby-codegen-valid-recursive"
    exec: ruby --disable-gems -Ilib bench/codspeed_bench.rb recursive codegen-valid 2000
  - name: "ruby-codegen-validate-openapi"
    exec: ruby --disable-gems -Ilib bench/codspeed_bench.rb openapi codegen-validate 20
  - name: "ruby-codegen-validate-swagger"
    exec: ruby --disable-gems -Ilib bench/codspeed_bench.rb swagger codegen-validate 10
  - name: "ruby-codegen-validate-geojson"
    exec: ruby --disable-gems -Ilib bench/codspeed_bench.rb geojson codegen-validate 100
  - name: "ruby-codegen-validate-citm"
    exec: ruby --disable-gems -Ilib bench/codspeed_bench.rb citm codegen-validate 25
  - name: "ruby-codegen-validate-fhir"
    exec: ruby --disable-gems -Ilib bench/codspeed_bench.rb fhir codegen-validate 25000
  - name: "ruby-codegen-validate-recursive"
